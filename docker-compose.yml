version: "3.8"

services:
  documind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - HYBRID_ALPHA=${HYBRID_ALPHA:-0.5}
      - MMR_DIVERSITY_LAMBDA=${MMR_DIVERSITY_LAMBDA:-0.7}
      - DOCUMIND_HOST=0.0.0.0
      - DOCUMIND_PORT=8000
    volumes:
      - documind_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  documind_data:
    driver: local
